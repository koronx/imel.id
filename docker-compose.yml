services:
  database:
    image: postgres:15-alpine
    container_name: maildb
    environment:
      POSTGRES_USER: mailuser
      POSTGRES_PASSWORD: mailpassword
      POSTGRES_DB: maildb
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - mailnet
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U mailuser"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5

  redis:
    image: redis:7-alpine
    container_name: mailredis
    ports:
      - "6379:6379"
    networks:
      - mailnet
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  mailserver:
    build:
      context: ./mailserver
      dockerfile: Dockerfile
    container_name: mailserver
    ports:
      - "25:25"       # SMTP
      - "143:143"     # IMAP
      - "587:587"     # SMTP submission
      - "993:993"     # IMAPS
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: maildb
      DB_USER: mailuser
      DB_PASSWORD: mailpassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEBUG: "true"
    depends_on:
      - database
      - redis
    networks:
      - mailnet
    volumes:
      - ./storage:/storage

  mail-worker:
    build:
      context: ./mailserver
      dockerfile: Dockerfile
    command: php /app/worker.php
    deploy:
      replicas: 3
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: maildb
      DB_USER: mailuser
      DB_PASSWORD: mailpassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEBUG: "true"
    depends_on:
      - database
      - redis
    networks:
      - mailnet
    volumes:
      - ./storage:/storage

  webmail:
    build:
      context: ./webmail
      dockerfile: Dockerfile
    container_name: webmail
    ports:
      - "80:80"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: maildb
      DB_USER: mailuser
      DB_PASSWORD: mailpassword
      MAIL_HOST: mailserver
      MAIL_PORT: 25
      IMAP_HOST: mailserver
      IMAP_PORT: 143
    depends_on:
      - mailserver
      - database
    networks:
      - mailnet
    volumes:
      - ./webmail/src:/var/www/html
      - ./storage:/storage

networks:
  mailnet:
    driver: bridge

volumes:
  redis-data: